name: CI-CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: unnathicicdrg.azurecr.io
  IMAGE_NAME: cicd-app

jobs:
  secret-scan:
    name: 1. Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: 2. Build and Test (Maven)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile, test and package
        run: mvn -B clean package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  docker:
    name: 3. Docker Build and Push (ACR)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and tag image
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} -t $REGISTRY/$IMAGE_NAME:latest .

      - name: Push image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME:latest

  deploy:
    name: 4. Deploy to AKS (Ansible) and Verify
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get nodes

      - name: Install Ansible
        run: pip install ansible-core

      - name: Deploy with Ansible
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            -e image_repo=$REGISTRY/$IMAGE_NAME \
            -e image_tag=${{ github.sha }}

      - name: Verify deployment
        run: |
          kubectl get deployment todo-app
          kubectl get pods -l app=todo-app
          kubectl get svc todo-app-svc
          IP=$(kubectl get svc todo-app-svc -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Checking http://$IP ..."
          for i in $(seq 1 10); do
            if curl -sf http://$IP/api/tasks; then
              echo ""
              echo "SUCCESS: App is live at http://$IP"
              exit 0
            fi
            sleep 10
          done
          echo "App did not respond"
          exit 1
