<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f4f8; margin: 0; padding: 40px 16px; }
  .card { max-width: 520px; margin: auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  h1 { margin: 0 0 4px; color: #1f2d3d; }
  .version { display: inline-block; background: #2563eb; color: #fff; font-size: 12px; padding: 3px 10px; border-radius: 999px; margin-bottom: 20px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; padding: 10px; border: 1px solid #ccd; border-radius: 8px; font-size: 15px; }
  button { padding: 10px 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .add { background: #2563eb; color: #fff; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: #999; }
  .del { background: #fee2e2; color: #b91c1c; }
  .empty { color: #888; text-align: center; padding: 16px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>My To-Do List</h1>
  <span class="version">Version 1</span>
  <form id="form">
    <input id="title" placeholder="What needs to be done?" autocomplete="off">
    <button class="add" type="submit">Add</button>
  </form>
  <ul id="list"></ul>
</div>
<script>
const list = document.getElementById('list');

async function load() {
  const res = await fetch('/api/tasks');
  const tasks = await res.json();
  list.innerHTML = '';
  if (tasks.length === 0) {
    list.innerHTML = '<li class="empty">No tasks yet. Add one above.</li>';
    return;
  }
  for (const t of tasks) {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = t.done;
    box.onchange = () => fetch('/api/tasks/' + t.id + '/toggle', { method: 'PUT' }).then(load);
    const span = document.createElement('span');
    span.textContent = t.title;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'Delete';
    del.onclick = () => fetch('/api/tasks/' + t.id, { method: 'DELETE' }).then(load);
    li.append(box, span, del);
    list.appendChild(li);
  }
}

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('title');
  if (!input.value.trim()) return;
  await fetch('/api/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: input.value })
  });
  input.value = '';
  load();
};

load();
</script>
</body>
</html>
